name: Gradle

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  build:
    strategy:
      # Finish other jobs even if one fails
      fail-fast: false

      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-latest
          - name: MacOS
            runs-on: macos-latest
          - name: Windows
            runs-on: windows-latest

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: never

      - name: Build project
        run: ./gradlew jar${{ matrix.name }} test jacocoTestReport

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: JAR (${{ matrix.name }})
          path: lwjgl3/build/libs/

      - name: Upload JUnit report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: JUnit (${{ matrix.name }})
          path: headless/build/reports/tests/test/

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: JaCoCo (${{ matrix.name }})
          path: headless/build/reports/jacoco/test/html/
