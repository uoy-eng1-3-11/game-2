name: Gradle

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  build:
    name: Build

    strategy:
      # Finish other jobs even if one fails
      fail-fast: false

      matrix:
        runs-on:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    runs-on: ${{  matrix.runs-on }}

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build project
        run: ./gradlew build
